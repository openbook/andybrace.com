# Runs the Playwright tests against https://andybrace.com, so changes Cloudflare makes at its
# edge (injected scripts, rewritten markup, missing headers) fail a check. See decision 0026.
name: Live site

on:
  # Cloudflare Pages reports each deploy as a check run named "Cloudflare Pages".
  check_run:
    types: [completed]
  # Daily, to catch dashboard changes made without a deploy.
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live
  cancel-in-progress: true

jobs:
  live:
    name: Live site matches the build
    if: >-
      github.event_name != 'check_run' ||
      (github.event.check_run.name == 'Cloudflare Pages' &&
      github.event.check_run.conclusion == 'success' &&
      github.event.check_run.check_suite.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:live
