# Weekly update PRs for npm packages and the SHA-pinned GitHub Actions. CI checks each one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @astrojs/check and typescript-eslint need TypeScript 6 or lower (decision 0003).
      # Remove this when they support 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
